<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phần mềm lập BGCT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1a2330;--mute:#5b6676;--line:#d3d9e1;--acc:#1d5f8c;--accink:#fff;--err:#b3261e;--ok:#1b6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1b222b;--ink:#e6ebf1;--mute:#97a3b3;--line:#303a47;--acc:#5aa6d8;--accink:#0b1620;--err:#ff8a80;--ok:#7bd69a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:680px;margin:0 auto}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.pick{display:block;cursor:pointer}
.pick b{display:block}
.pick small{color:var(--mute)}
.pick input{display:block;margin-top:8px;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0 0 12px}
legend{font-weight:600;padding:0;margin-bottom:6px}
.seg label{margin-right:16px;white-space:nowrap}
select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
button,a.btn{display:block;width:100%;padding:12px;border:0;border-radius:8px;background:var(--acc);color:var(--accink);font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a.btn{margin-top:12px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{margin:12px 0;font-weight:600}
.err{color:var(--err)}.ok{color:var(--ok)}
.note{margin:0;color:var(--mute);font-size:.9rem}
.chk{display:block;margin-top:10px}
.sw{border:0;padding:0;margin:12px 0 0}
.sw label{display:block;margin-top:8px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
tr.g td{font-weight:600;background:var(--bg)}
</style>
</head>
<body>
<main>
<h1>Phần mềm lập BGCT</h1>

<div class="card"><label class="pick"><b>1. Báo giá gốc</b><small>File .xls hoặc .xlsx</small>
<input type="file" id="f1" accept=".xls,.xlsx"></label></div>
<div class="card"><label class="pick"><b>2. Mẫu BGCT</b><small>Chỉ nhận .xlsx (mở file mẫu trong Excel, Save As .xlsx một lần)</small>
<input type="file" id="f2" accept=".xlsx"></label></div>

<div class="card">
<fieldset class="sw"><legend>Đảo từ ngữ</legend>
<label>T / P thành<select id="w-tp"><option value="0">tài / phụ</option><option value="1">trái / phải</option><option value="2">LH / RH</option><option value="">Giữ nguyên</option></select></label>
<label>Tai xe thành<select id="w-tai"><option value="tai vè">tai vè</option><option value="vè trước">vè trước</option><option value="">Giữ nguyên</option></select></label>
<label>Calang thành<select id="w-cal"><option value="ca lăng">ca lăng</option><option value="ga lăng">ga lăng</option><option value="">Giữ nguyên</option></select></label>
<label>Capo thành<select id="w-cap"><option value="ca pô">ca pô</option><option value="ca bô">ca bô</option><option value="">Giữ nguyên</option></select></label>
<label class="chk"><input type="checkbox" id="w-can" checked> cản → ba đờ sốc</label>
<label class="chk"><input type="checkbox" id="w-hong" checked> hông sau → hông vè sau</label>
<label class="chk"><input type="checkbox" id="w-mam" checked> lazang → mâm</label></fieldset>
<label class="chk"><input type="checkbox" id="shuf"> Đảo thứ tự dòng</label></div>

<button id="go" disabled>Tạo báo giá</button>
<div id="msg" role="status"></div>
<div id="dl"></div>
<div id="prev"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const norm=v=>v==null?'':String(v).replace(/\s+/g,' ').trim().toLowerCase();
const KEYS={stt:['stt','tt'],name:['hạng mục','tên','nội dung','diễn giải','mô tả'],unit:['đvt','dvt','đơn vị','đv'],qty:['số lượng','sl','khối lượng'],price:['đơn giá'],amount:['thành tiền'],note:['ghi chú','chi chú','note']};
const TOT=['tổng','cộng','vat','thuế'];
const LAB=['mst','điện thoại','biển số','loại xe','năm sx','tên khách','địa chỉ','lái xe','('];
const fmt=n=>Math.round(n).toLocaleString('vi-VN');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toNum(v){
  if(v==null||v==='')return null; if(typeof v==='number')return v;
  let s=String(v).replace(/[^\d,.\-]/g,''); if(!s)return null;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  else if(s.includes(','))s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function sectionKey(t){
  t=norm(t);
  if(/phụ tùng|vật tư|spare/.test(t))return'vattu';
  if(t.includes('điện'))return'dien';
  if(/máy|gầm/.test(t))return'may';
  if(/sơn|paint/.test(t))return'son';
  if(/đồng|body/.test(t))return'dong';
  return'khac';
}
function findHeader(get,maxR,maxC){
  for(let r=1;r<=Math.min(maxR,60);r++){
    const cols={};
    for(let c=1;c<=maxC;c++){
      const t=norm(get(r,c)); if(!t)continue;
      for(const k in KEYS) if(!(k in cols)&&KEYS[k].some(p=>t===p||t.startsWith(p)))cols[k]=c;
    }
    if(cols.name&&cols.qty&&cols.price)return[r,cols];
  }
  return[null,null];
}
const isTot=(get,r,maxC)=>{for(let c=1;c<=maxC;c++)if(TOT.some(p=>norm(get(r,c)).startsWith(p)))return true;return false;};

/* ---------- số thành chữ ---------- */
const D=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function read3(n,full){
  const h=Math.floor(n/100),t=Math.floor(n%100/10),o=n%10,p=[];
  if(h||full)p.push(D[h]+' trăm');
  if(t>1){p.push(D[t]+' mươi');p.push(o==1?'mốt':o==4?'tư':o==5?'lăm':o?D[o]:'');}
  else if(t==1){p.push('mười');p.push(o==5?'lăm':o?D[o]:'');}
  else if(o){if(h||full)p.push('lẻ');p.push(D[o]);}
  return p.filter(Boolean).join(' ');
}
function soThanhChu(n){
  n=Math.round(n); if(n==0)return'Không đồng.';
  const U=['',' nghìn',' triệu',' tỷ'],g=[];
  while(n>0){g.push(n%1000);n=Math.floor(n/1000);}
  const parts=[];
  for(let i=g.length-1;i>=0;i--){if(g[i])parts.push(read3(g[i],i!=g.length-1)+(U[i]||''));}
  const s=parts.join(', ');
  return s[0].toUpperCase()+s.slice(1)+' đồng chẵn.';
}

/* ---------- đọc báo giá công ty 1 ---------- */
function parseC1(rows){
  const maxR=rows.length,maxC=Math.max(...rows.map(r=>r.length));
  const get=(r,c)=>(rows[r-1]||[])[c-1];
  const [hdr,cols]=findHeader(get,maxR,maxC);
  if(!hdr)throw new Error('Không tìm thấy dòng tiêu đề trong file công ty 1 (cần cột Hạng mục, SL, Đơn giá).');
  const fv=label=>{
    for(let r=1;r<=hdr;r++)for(let c=1;c<=maxC;c++)if(norm(get(r,c)).startsWith(label)){
      for(let c2=c+1;c2<=maxC;c2++){const v=get(r,c2);if(v!=null&&v!=='')return LAB.some(p=>norm(v).startsWith(p))?null:v;}
      return null;
    }
    return null;
  };
  const info={name:fv('tên khách'),address:fv('địa chỉ'),plate:fv('biển số'),model:fv('loại xe'),date:fv('ngày'),no:null,suffix:'/DTSC'};
  for(let r=1;r<hdr;r++)for(let c=1;c<=maxC;c++)if(norm(get(r,c)).startsWith('số (')){
    info.no=get(r+1,c);info.suffix=get(r+1,c+1)||'/DTSC';
  }
  const secs=[];let cur=null;
  for(let r=hdr+1;r<=maxR;r++){
    if(isTot(get,r,maxC))break;
    const g=k=>cols[k]?get(r,cols[k]):null;
    const name=g('name'),qty=toNum(g('qty')),price=toNum(g('price'));
    if((name==null||name==='')&&qty==null&&price==null)continue;
    if(qty==null&&price==null&&String(name).trim().startsWith('('))continue;
    if(qty==null&&price==null){cur={title:String(name),key:sectionKey(name),items:[]};secs.push(cur);continue;}
    if(!cur){cur={title:'Khác',key:'khac',items:[]};secs.push(cur);}
    cur.items.push({name,unit:g('unit'),qty:qty??1,price:price||0,note:g('note')});
  }
  if(!secs.some(s=>s.items.length))throw new Error('Không đọc được hạng mục nào từ file công ty 1.');
  return{info,secs};
}
async function readC1(file){
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rg=XLSX.utils.decode_range(ws['!ref']);rg.s.r=0;rg.s.c=0;
  return parseC1(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,range:rg}));
}

/* ---------- tăng giá ---------- */
const POS=new Set(['trước','sau','tài','phụ','trái','phải','t','p']);
const baseName=n=>String(n).toLowerCase().split(/[\s,()\-\/]+/).filter(w=>w&&!POS.has(w)).join(' ');
function pickPrice(price,lo,hi,labor){
  if(!price)return 0;
  const min=price*(1+lo/100),max=price*(1+hi/100);
  if(labor&&price>=100000){
    const a=Math.ceil(min/50000),b=Math.floor(max/50000);
    if(a<=b)return(a+Math.floor(Math.random()*(b-a+1)))*50000;
    return Math.max(50000,Math.round(price*(1+(lo+hi)/200)/50000)*50000);
  }
  for(const st of [100000,10000,1000,100,1]){
    const a=Math.ceil(min/st),b=Math.floor(max/st);
    if(a<=b)return(a+Math.floor(Math.random()*(b-a+1)))*st;
  }
  return Math.round(min);
}
let SHUFFLE=false;
const isLab=n=>norm(n).split(/[ ,.()/-]+/).includes('công');
const wrapLines=(txt,w)=>{let n=1,len=0;for(const word of String(txt).split(' ')){const l=word.length;if(len&&len+1+l>w){n++;len=l;}else len+=len?1+l:l;}return n;};
const PAIRS=[['tài','phụ'],['trái','phải'],['LH','RH']];
const keepCase=(m,r)=>m[0]!==m[0].toLowerCase()?r[0].toUpperCase()+r.slice(1):r;
const wre=w=>new RegExp(String.raw`(?<![\p{L}])`+w+String.raw`(?![\p{L}])`,'giu');
function fixCase(n){
  n=String(n);
  if(n===n.toLowerCase()||n!==n.toUpperCase())return n;
  const s=n.toLowerCase().replace(/(^|[ (,/-])([tp]|lh|rh)(?=$|[ ),/-])/g,(m,pre,w)=>pre+w.toUpperCase());
  let i=0;while(i<s.length&&s[i].toLowerCase()===s[i].toUpperCase())i++;
  return s.slice(0,i)+(s[i]||'').toUpperCase()+s.slice(i+1);
}
function swapWords(name,o){
  let s=String(name);
  if(o.tai)s=s.replace(wre('tai +xe'),m=>keepCase(m,o.tai));
  if(o.cal)s=s.replace(wre('calang'),m=>keepCase(m,o.cal));
  if(o.cap)s=s.replace(wre('capo'),m=>keepCase(m,o.cap));
  if(o.can)s=s.replace(wre('cản'),m=>keepCase(m,'ba đờ sốc'));
  if(o.hong)s=s.replace(wre('hông +sau'),m=>keepCase(m,'hông vè sau'));
  if(o.mam)s=s.replace(wre('laz[aă]ng'),m=>keepCase(m,'mâm'));
  if(o.tp!==''){const p=PAIRS[+o.tp];s=s.replace(/(^|[ (,/-])([TP])(?=$|[ ),/-])/g,(m,pre,l)=>pre+p[l==='T'?0:1]);}
  return s;
}
function shuffleItems(items){
  const a=items.filter(i=>!isLab(i.name)),b=items.filter(i=>isLab(i.name));
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return[...a,...b];
}
function applyMarkup(secs,lo,hi,opt={}){
  const rows=[],memo={},ctx={};
  for(const s of secs){
    if(opt.shuffle)s.items=shuffleItems(s.items);
    if(s.items.length)rows.push({g:s.title});
    for(const it of s.items){
      const labor=s.key==='dong'||s.key==='son'||isLab(it.name);
      const base=baseName(it.name);
      const [l,h]=(s.key==='vattu'&&!labor)?[20,50]:[lo,hi];
      const key=base+'|'+it.price+'|'+labor+'|'+l;
      it.np=(memo[key]??=pickPrice(it.price,l,h,labor));
      it.name=fixCase(it.name);
      if(opt.swap)it.name=swapWords(it.name,opt.swap);
      rows.push({name:it.name,qty:it.qty,old:it.price,np:it.np,pct:it.price?(it.np/it.price-1)*100:0});
    }
  }
  return rows;
}

/* ---------- ghi vào mẫu công ty 2 ---------- */
function cv(c){
  let v=c.value;
  if(v instanceof Date)return v;
  if(v&&typeof v==='object'){
    if('result' in v)v=v.result;
    else if(v.richText)v=v.richText.map(t=>t.text).join('');
    else if(v.text)v=v.text;
  }
  return v;
}
function shift(ws,idx,delta,NC){
  const pr=a=>{const m=a.match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/);return{c1:m[1],r1:+m[2],c2:m[3],r2:+m[4]};};
  const ms=ws.model.merges.map(pr).filter(m=>m.r1>=idx);
  ms.forEach(m=>ws.unMergeCells(`${m.c1}${m.r1}:${m.c2}${m.r2}`));
  const last=ws.rowCount;
  const mv=(s,d)=>{
    for(let c=1;c<=NC;c++){const a=ws.getCell(s,c),b=ws.getCell(d,c);b.value=a.value;b.style=Object.assign({},a.style);}
    ws.getRow(d).height=ws.getRow(s).height;
  };
  const clr=r=>{for(let c=1;c<=NC;c++){const b=ws.getCell(r,c);b.value=null;b.style={};}ws.getRow(r).height=undefined;};
  if(delta>0){
    for(let r=last;r>=idx;r--)mv(r,r+delta);
    for(let r=idx;r<idx+delta;r++)clr(r);
  }else{
    const n=-delta;
    for(let r=idx+n;r<=last;r++)mv(r,r-n);
    for(let r=last-n+1;r<=last;r++)clr(r);
  }
  for(const m of ms){
    if(delta<0&&m.r1<idx-delta)continue;
    ws.mergeCells(`${m.c1}${m.r1+delta}:${m.c2}${m.r2+delta}`);
  }
}
async function fillTemplate(buf,info,secs){
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);
  const ws=wb.worksheets[0];
  const NC=Math.max(ws.columnCount,8);
  const get=(r,c)=>cv(ws.getCell(r,c));
  const [hdr,cols]=findHeader(get,ws.rowCount,NC);
  if(!hdr)throw new Error('Không tìm thấy dòng tiêu đề trong mẫu công ty 2 (cần cột Nội dung, SL, Đơn giá).');

  const tsecs=()=>{
    const out=[];let cur=null;
    for(let r=hdr+1;;r++){
      if(r>ws.rowCount||isTot(get,r,NC)){if(cur)out.push(cur);return[out,r];}
      const t=get(r,cols.name),q=get(r,cols.qty);
      if(t!=null&&t!==''&&(q==null||q==='')){if(cur)out.push(cur);cur={hdr:r,key:sectionKey(t),k:0};}
      else if(cur)cur.k++;
    }
  };
  let [ts]=tsecs();
  if(!ts.length)throw new Error('Mẫu công ty 2 không có dòng tiêu đề nhóm (PHẦN SƠN, PHẦN ĐỒNG...).');

  const groups={};
  for(const s of secs)(groups[s.key]??=[]).push(...s.items);
  const tk=ts.map(s=>s.key);
  for(const k of Object.keys(groups))if(!tk.includes(k)){
    const t=tk.includes('khac')?'khac':tk[tk.length-1];
    (groups[t]??=[]).push(...groups[k]);delete groups[k];
  }
  if(SHUFFLE)for(const k in groups)groups[k]=[...groups[k].filter(i=>!isLab(i.name)),...groups[k].filter(i=>isLab(i.name))];

  for(const s of [...ts].reverse()){
    const n=(groups[s.key]||[]).length,{hdr:h,k}=s;
    if(n==0){shift(ws,h,-(k+1),NC);continue;}
    const d=n-k;
    if(d>0){
      const src=k>0?h+k:h+1;
      const st=[];for(let c=1;c<=NC;c++)st.push(Object.assign({},ws.getCell(src,c).style));
      const ht=ws.getRow(src).height;
      shift(ws,h+1+k,d,NC);
      for(let r=h+1+k;r<h+1+k+d;r++){for(let c=1;c<=NC;c++)ws.getCell(r,c).style=Object.assign({},st[c-1]);ws.getRow(r).height=ht;}
    }else if(d<0)shift(ws,h+1+n,d,NC);
  }

  let totalRow;[ts,totalRow]=tsecs();
  const L=c=>ws.getColumn(c).letter;
  const put=(r,c,v)=>{ws.getCell(r,c).value=v;};
  const hdrRows=[];let grand=0;
  for(const s of ts){
    const items=groups[s.key]||[],first=s.hdr+1;let sub=0;
    items.forEach((it,i)=>{
      const r=first+i,amt=it.qty*it.np;sub+=amt;grand+=amt;
      if(cols.stt)put(r,cols.stt,i+1);
      put(r,cols.name,it.name);
      const nc=ws.getCell(r,cols.name);nc.alignment=Object.assign({},nc.alignment,{wrapText:true});
      const ln=wrapLines(it.name,Math.floor((ws.getColumn(cols.name).width||35)*0.95));
      if(ln>1)ws.getRow(r).height=Math.max(ws.getRow(r).height||0,ln*15.75+1.5);
      if(cols.unit)put(r,cols.unit,it.unit);
      put(r,cols.qty,it.qty);put(r,cols.price,it.np);
      if(cols.amount)put(r,cols.amount,{formula:`${L(cols.qty)}${r}*${L(cols.price)}${r}`,result:amt});
      if(cols.note&&it.note)put(r,cols.note,it.note);
    });
    if(cols.amount)put(s.hdr,cols.amount,{formula:`SUM(${L(cols.amount)}${first}:${L(cols.amount)}${first+items.length-1})`,result:sub});
    hdrRows.push([s.hdr,sub]);
  }
  if(cols.amount)put(totalRow,cols.amount,{formula:hdrRows.map(([r])=>L(cols.amount)+r).join('+'),result:grand});
  for(let r=totalRow;r<=ws.rowCount;r++)for(let c=1;c<=NC;c++){
    const v=get(r,c);
    if(typeof v==='string'&&norm(v).startsWith('bằng chữ')){put(r,c,'Bằng chữ: '+soThanhChu(grand));break;}
  }

  /* thông tin chung */
  const find=l=>{for(let r=1;r<=hdr;r++)for(let c=1;c<=NC;c++){const v=get(r,c);if(typeof v==='string'&&norm(v).startsWith(l))return[r,c];}return null;};
  const append=(l,v)=>{const p=find(l);if(p&&v)put(p[0],p[1],String(get(...p)).trimEnd()+' '+v);};
  const right=(l,v)=>{const p=find(l);if(p&&v){const c=ws.getCell(p[0],p[1]+1);(c.master||c).value=v;}};
  append('tên đơn vị',info.name);append('địa chỉ',info.address);
  right('số xe',info.plate);
  const m=String(info.model||'').trim(),i=m.indexOf(' ');
  right('nhãn hiệu',i<0?m:m.slice(0,i));right('loại xe',i<0?'':m.slice(i+1));
  if(info.date instanceof Date){
    const d=new Date(info.date.getTime()+12*3600e3),p2=x=>String(x).padStart(2,'0');
    for(let r=1;r<hdr;r++)for(let c=1;c<=NC;c++){
      const v=get(r,c);
      if(typeof v==='string'&&/ngày\s*tháng\s*năm/i.test(v))
        put(r,c,v.replace(/ngày\s*tháng\s*năm/i,`ngày ${p2(d.getDate())} tháng ${p2(d.getMonth()+1)} năm ${d.getFullYear()}`));
    }
  }

  ws.pageSetup.fitToPage=true;ws.pageSetup.fitToWidth=1;ws.pageSetup.fitToHeight=0;
  wb.calcProperties={fullCalcOnLoad:true};
  return{data:await wb.xlsx.writeBuffer(),grand};
}

/* ---------- giao diện ---------- */
const f1=$('f1'),f2=$('f2'),go=$('go'),msg=$('msg');
const ready=()=>{go.disabled=!(f1.files[0]&&f2.files[0]);};
f1.onchange=f2.onchange=ready;

go.onclick=async()=>{
  msg.className='';msg.textContent='Đang xử lý...';$('dl').innerHTML='';$('prev').innerHTML='';go.disabled=true;
  try{
    if(!/\.xlsx$/i.test(f2.files[0].name))throw new Error('Mẫu công ty 2 phải là .xlsx. Mở file trong Excel, Save As .xlsx rồi chọn lại.');
    const lo=10,hi=20;
    const {info,secs}=await readC1(f1.files[0]);
    SHUFFLE=$('shuf').checked;
    const rows=applyMarkup(secs,lo,hi,{swap:{tp:$('w-tp').value,tai:$('w-tai').value,cal:$('w-cal').value,cap:$('w-cap').value,can:$('w-can').checked,hong:$('w-hong').checked,mam:$('w-mam').checked},shuffle:SHUFFLE});
    const {data,grand}=await fillTemplate(await f2.files[0].arrayBuffer(),info,secs);
    const plate=String(info.plate??'').replace(/[/:*?"<>|]/g,'').replace(/ *- */g,'-').replace(/ +/g,'-').trim(),fname=`BGCT${plate?'-'+plate:''}.xlsx`,blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    msg.className='ok';msg.textContent=`Xong: ${rows.filter(r=>!r.g).length} hạng mục, tổng cộng ${fmt(grand)} đ`;
    $('dl').innerHTML='<button id="save" style="margin-top:12px">Tải báo giá công ty 2</button>';
    $('save').onclick=async()=>{
      try{
        const d=window.claude?await claude.use('downloads'):null;
        if(d){await d.save({filename:fname,data:blob});}
        else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();}
      }catch(e){if(e&&e.code!=='declined'){msg.className='err';msg.textContent='Không tải được file: '+(e.message||e);}}
    };
    $('prev').innerHTML='<div class="scroll" style="margin-top:12px"><table><tr><th>Hạng mục</th><th class="n">SL</th><th class="n">Giá CT1</th><th class="n">Giá CT2</th><th class="n">Tăng</th></tr>'+
      rows.map(r=>r.g?`<tr class="g"><td colspan="5">${esc(r.g)}</td></tr>`:`<tr><td>${esc(r.name)}</td><td class="n">${r.qty}</td><td class="n">${fmt(r.old)}</td><td class="n">${fmt(r.np)}</td><td class="n">${r.pct.toFixed(1)}%</td></tr>`).join('')+'</table></div>';
  }catch(e){msg.className='err';msg.textContent='Lỗi: '+e.message;console.error(e);}
  ready();
};
</script>
