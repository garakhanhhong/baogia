<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAU DU TOAN</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6a737d;--bd:#d6dae0;--ac:#1a5fb4;--ach:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1f2328;--tx:#e8eaed;--mu:#9aa3ad;--bd:#383e46;--ac:#6ea8fe;--ach:#0b1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--card:#1f2328;--tx:#e8eaed;--mu:#9aa3ad;--bd:#383e46;--ac:#6ea8fe;--ach:#0b1220;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px 12px 8px}
h1{font-size:19px;margin:6px 0 2px}.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
section,.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:12px}
h3{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}h3 b{white-space:nowrap}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
label{font-size:12px;color:var(--mu);display:block}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-top:1px dashed var(--bd);align-items:center}
.row .nm{flex:1 1 100%}.row .sm{flex:1 1 90px}.row .xs{flex:0 1 64px}.row .md{flex:1 1 100px}.row .nt{flex:1 1 120px}
output{flex:1 1 90px;text-align:right;font-weight:600}
.x{flex:0 0 auto;width:auto;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:7px;padding:7px 10px}
.add{background:none;border:1px dashed var(--ac);color:var(--ac);border-radius:7px;padding:8px;width:100%;margin-top:4px;font:inherit}
.bar{width:calc(100% - 24px);max-width:956px;margin:0 auto 28px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.bar>div{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tot{flex:1 1 220px}.tot small{color:var(--mu);display:block;font-size:12px}.tot strong{font-size:18px}
.go{background:var(--ac);color:var(--ach);border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:700;flex:1 1 150px}
#msg{font-size:13px;color:var(--mu);width:100%}
.auto{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.tabs{display:flex;margin-bottom:10px;border:1px solid var(--bd);border-radius:9px;overflow:hidden}.tabs button{flex:1;padding:10px;border:0;background:var(--card);color:var(--tx);font:inherit}.tabs .on{background:var(--ac);color:var(--ach);font-weight:700}
.hint{color:var(--mu);font-size:13px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mu)}.chip{border:1px dashed var(--ac);background:none;color:var(--ac);border-radius:14px;padding:5px 10px;font:inherit}
.x.ask{color:#b3261e;border-color:#b3261e}
#ten,#bks,#loai,#nsx,#mst,#lx,#dt,#fn,#fn2{text-transform:uppercase}
textarea{resize:none;overflow:hidden;line-height:1.35}
.alt{background:none;color:var(--ac);border:1px solid var(--ac)}
#pv{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#pv[hidden]{display:none}
.pvh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}.pvh .go{flex:0 0 auto}#pm{font-size:13px;color:var(--mu)}
#pvb{overflow:auto;padding:10px;flex:1}
.warn{background:#fff3cd;color:#664d03;border:1px solid #e0c36a;border-radius:7px;padding:8px;margin-bottom:8px;font-size:13px}
.paper{background:#fff;color:#000;font:12px/1.35 Arial,Helvetica,sans-serif;width:794px;padding:20px 26px;box-sizing:border-box}
.paper *{box-sizing:border-box}.pk{display:flex;justify-content:space-between;margin-bottom:3px}.fr{border:2px solid #000}
.hdr{display:grid;grid-template-columns:36% 1fr 22%;border-bottom:1px solid #000}.hdr .lg{padding:4px}.hdr .lg img{width:100%;display:block}
.ttl{text-align:center;padding:6px 4px}.ttl h2{margin:4px 0 2px;font-size:20px}.ttl i{font-size:17px}
.nb{border-left:1px solid #000;display:flex;flex-direction:column;justify-content:center}.nb div{padding:6px;text-align:right}.nb .a{border-bottom:1px dotted #000}
.bar2{text-align:center;font-weight:bold;padding:6px;border-bottom:1px solid #000}
.paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.info td{border:1px solid #000;padding:2px 5px;height:30px;word-wrap:break-word}.info .lb small{display:block;color:#666;font-style:italic;font-size:10px}.info .vl{text-align:center;font-weight:bold}
.dt th{border:1px solid #000;padding:3px;text-align:center}.dt th small{display:block;color:#666;font-style:italic;font-weight:normal}
.dt td{border-left:1px solid #000;border-right:1px solid #000;border-bottom:1px dotted #000;padding:3px 5px;vertical-align:middle;word-wrap:break-word}
.dt .c{text-align:center}.dt .n{text-align:right;white-space:nowrap}.dt .sh td{border-top:1px dotted #000}.dt .tt td{border-top:1px solid #000;border-bottom:1px solid #000;font-weight:bold}
.wd{padding:6px;border-bottom:1px solid #000}.nt2{padding:6px 8px;border-bottom:2px solid #000}.nt2 ul{margin:4px 0 0;padding-left:16px}.nt2 li{margin-bottom:4px;text-align:justify}
.sg th{padding:5px;text-align:center}.sg td{height:110px;vertical-align:top;text-align:center;padding:5px}.sg small{display:block;font-weight:normal;font-style:italic}.sg .rb{border-right:1px solid #000}
.dh{flex:0 0 auto;padding:7px 10px;border:1px solid var(--bd);border-radius:7px;color:var(--mu);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;line-height:1.2}
.row.drag{opacity:.65;background:var(--bg);outline:2px solid var(--ac)}
html,body{overflow-x:hidden}
input,select,textarea,button,details,summary{box-sizing:border-box!important;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:38px;min-width:0;text-align:left}
.g>div,.box>*{min-width:0}
</style>
</head>
<body>
<main>
<h1>Dự toán sửa chữa</h1>
<div class="box"><h3>Thông tin phiếu và khách hàng</h3>
<div class="g">
<div><label>Kính gửi</label><input id="kg"></div>
<div><label>Số phiếu</label><input id="so"></div>
<div><label>Ngày</label><input id="ngay" type="date" oninput="autoFn()"></div>
<div><label>Tên khách hàng</label><input id="ten"></div>
<div><label>Biển số</label><input id="bks" oninput="autoFn()"></div>
<div><label>Loại xe</label><input id="loai"></div>
<div><label>Năm SX</label><input id="nsx" inputmode="numeric"></div>
<div><label>Địa chỉ</label><input id="dc"></div>
<div><label>MST</label><input id="mst"></div>
<div><label>Lái xe</label><input id="lx"></div>
<div><label>Điện thoại</label><input id="dt" inputmode="tel"></div>
<div><label>Thuế VAT</label><select id="vat" onchange="calc()"><option value="0" selected>Không tính VAT</option><option value="8">VAT 8%</option></select></div>
<div><label>Tiêu đề nhóm</label><select id="grp" onchange="grpUi()"><option value="1" selected>Có</option><option value="0">Không tiêu đề nhóm</option></select></div>
</div></div>
<details class="box" open><summary style="font-weight:600;cursor:pointer">⚡ Nhập nhanh nhiều dòng</summary>
<select id="bsec"><option value="auto" selected>Tự chia nhóm</option><option value="0">Phụ tùng thay thế</option><option value="3">Đồng</option><option value="6">Sơn</option><option value="7">Nội dung khác</option><option value="1">Máy - Gầm</option><option value="2">Điện - Điện lạnh</option><option value="4">Chassi</option><option value="5">Nội thất</option></select>
<textarea id="bulk" rows="6" style="margin-top:8px;overflow:auto;resize:vertical" placeholder="sơn cửa trước t 700&#10;sơn cửa sau p&#10;sơn tai xe t 600k&#10;gò cản trước 400&#10;gương chiếu hậu p 1.200.000&#10;công thay thế 150"></textarea>
<button class="go" style="width:100%;margin-top:8px" onclick="Bulk()">Thêm vào phiếu</button>
<p class="hint" id="bmsg" style="margin:8px 0 0"></p></details>
<div id="secs"></div>
</main>
<div id="pv" hidden><div class="pvh"><button class="x" onclick="$('pv').hidden=true">← Quay lại chỉnh sửa</button><input id="fn2" placeholder="Tên file" oninput="fnEdited=true;$('fn').value=this.value" style="flex:1 1 150px"><button class="go" onclick="exp()">Xuất Excel</button><button class="go alt" onclick="expPdf()">Xuất PDF</button><span id="pm"></span></div><div id="pvb"></div></div>
<div class="bar"><div>
<div class="tot"><small id="vl">Tổng cộng</small><strong id="tt">0</strong> VND<small id="wd"></small></div>
<button class="go alt" onclick="prev()">Xem trước</button>
<button class="go" onclick="exp()">Xuất Excel</button>
<button class="go alt" onclick="expPdf()">Xuất PDF</button>
<input id="fn" placeholder="Tên file" oninput="fnEdited=true;$('fn2').value=this.value" style="flex:1 1 100%"><div id="msg"></div>
</div></div>
